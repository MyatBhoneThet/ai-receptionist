services:
  backend:
    image: myatbhonethet/ai-receptionist-backend:latest
    build:
      context: ./backend
    ports:
      - "4000:4000"
    env_file:
      - .env
    expose:
      - "4000"
    networks:
      - ai-receptionist-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    image: myatbhonethet/ai-receptionist-frontend:latest
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ai-receptionist-net
    restart: unless-stopped

networks:
  ai-receptionist-net:
    driver: bridge
